[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syncfit-backend"
version = "0.1.0"
description = "SyncFit Edge backend: FastAPI, WebSockets and telemetry orchestration (Python)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic[email]>=2.0",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    "qrcode[pil]>=7.4",
    "syncfit-database @ git+https://github.com/Jenifrutica/syncfit-database.git",
    "syncfit-contracts @ git+https://github.com/Jenifrutica/syncfit-contracts.git#subdirectory=python",
    "syncfit-core @ git+https://github.com/Jenifrutica/syncfit-core.git",
    "syncfit-simulator @ git+https://github.com/Jenifrutica/syncfit-simulator.git#subdirectory=py",
]

[project.optional-dependencies]
reasoning = [
    "syncfit-ai-reasoning @ git+https://github.com/Jenifrutica/syncfit-ai-reasoning.git",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.ws",
    "app.services",
    "app.analytics",
    "app.persistence",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
