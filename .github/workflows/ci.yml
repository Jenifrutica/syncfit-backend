# NOTE: this repository depends on the private siblings syncfit-contracts and
# syncfit-core, cloned here using the SYNCFIT_TOKEN secret.
# TODO: when those repositories are public, remove the `token:` inputs and delete
# the SYNCFIT_TOKEN secret.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sibling syncfit-contracts
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-contracts
          path: deps/syncfit-contracts
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}
      - name: Checkout sibling syncfit-core
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-core
          path: deps/syncfit-core
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}
      - name: Checkout sibling syncfit-simulator
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-simulator
          path: deps/syncfit-simulator
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}
      - name: Checkout sibling syncfit-database
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-database
          path: deps/syncfit-database
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}
      # The deterministic pattern engine (build_prescription) lives here; without
      # it capture silently falls back to the legacy simulator builder.
      - name: Checkout sibling syncfit-ai-reasoning
        uses: actions/checkout@v4
        with:
          repository: Jenifrutica/syncfit-ai-reasoning
          path: deps/syncfit-ai-reasoning
          ref: main
          token: ${{ secrets.SYNCFIT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./deps/syncfit-contracts/python ./deps/syncfit-core ./deps/syncfit-database
          pip install --no-deps -e ./deps/syncfit-simulator/py
          pip install --no-deps ./deps/syncfit-ai-reasoning
          pip install --no-deps -e .
          pip install fastapi "uvicorn[standard]" "pydantic[email]" pyjwt argon2-cffi slowapi sqlalchemy pytest httpx numpy "qrcode[pil]" openai
      - name: Test
        run: pytest -q
